name: Validate

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-source-guard:
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request')
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: 🚦 Reject manual version changes
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi

          changed="$(git diff -U0 "${range}" -- \
            pyproject.toml custom_components/edge_tts/manifest.json |
            grep -E '^[+-](version = |[[:space:]]*"version":)' || true)"

          if [[ -z "${changed}" ]]; then
            exit 0
          fi

          if [[ "${ACTOR}" == "github-actions[bot]" && "${HEAD_MESSAGE}" == Release\ v* ]]; then
            exit 0
          fi

          {
            echo "Version files must not be edited manually."
            echo "Use the Release workflow_dispatch input so GitHub Actions bumps, commits, tags, and publishes the version."
            echo "Changed version files:"
            echo "${changed}"
          } >&2
          exit 1

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🛠️ Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Check locked dependencies
        run: uv sync --locked --group dev
      - name: 🧹 Ruff check
        run: uv run ruff check custom_components tests
      - name: 🎨 Ruff format check
        run: uv run ruff format --check custom_components tests
      - name: 🧪 Pytest
        run: uv run pytest -q

  validate-hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🏃 Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🏃 HACS validation
        uses: hacs/action@22.5.0
        env:
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
          # Custom distribution retains PolyForm Noncommercial; GitHub reports
          # SPDX NOASSERTION. This is not eligibility for the default HACS index.
          ignore: license

  validate-homeassistant:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: 🛠️ Home Assistant configuration
        run: |
          mkdir ./test_configuration
          cp -r ./custom_components ./test_configuration
          echo "default_config:" >> ./test_configuration/configuration.yaml

      - name: 🏡 Home Assistant validation
        uses: ludeeus/setup-homeassistant@main
        with:
          tag: ${{ matrix.channel }}
          config-dir: test_configuration
