[project]
name = "hass-edge-tts"
version = "0.8.3"
description = "Microsoft Edge TTS for Home Assistant (maintained fork)"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = []

[tool.uv]
package = false
# Use patched transitive packages in the HA test environment.
override-dependencies = [
    "cryptography>=50.0.0,<51",
    "pillow>=12.3.0,<13",
    "pyjwt>=2.15.0,<3",
]

[dependency-groups]
dev = [
    "edge-tts>=7.2.0",
    "ha-ffmpeg==3.2.2",
    "homeassistant==2026.7.4",
    "mutagen==1.47.0",
    "pytest-homeassistant-custom-component==0.13.348",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
